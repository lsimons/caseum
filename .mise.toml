# mise: https://mise.jdx.dev/

[settings]
minimum_release_age = "7d"
lockfile = true

# Tools are exact-pinned on purpose. A partial pin like "1.3" resolves to
# whatever is newest at install time, so an upstream compromise could arrive by
# auto-download on any machine or CI runner. Bumps are deliberate commits.
[tools]
actionlint = "1.7.12"
bun = "1.3.14"
gitleaks = "8.30.1"
lychee = "0.24.2"
prek = "0.4.12"
# Load-bearing, not cosmetic: actionlint exits 0 without ever inspecting a
# `run:` block if shellcheck is not on PATH, so dropping this pin would silently
# turn half of `mise run audit` into a no-op.
shellcheck = "0.11.0"
zizmor = "1.29.0"

[tasks.docs-install]
description = "Install the site dependencies (bun)"
dir = "docs"
run = "bun install"

[tasks.docs-dev]
description = "Start the live-reloading dev server"
dir = "docs"
run = "bun run dev"

[tasks.docs-build]
description = "Build the static site into docs/dist"
dir = "docs"
run = "bun run build"

[tasks.docs-preview]
description = "Preview the production build"
dir = "docs"
run = "bun run preview"

[tasks.docs-check]
description = "Astro type/content check"
dir = "docs"
run = "bunx astro check"

[tasks.docs-favicon]
description = "Regenerate the honeycomb favicon + apple-touch-icon from the palette"
dir = "docs"
run = "bun run scripts/gen-favicon.mjs"

[tasks.docs-verify]
description = "Check the built site: base path applied, and every internal link resolves"
dir = "docs"
# Invoked as `bash <script>` rather than `./<script>`: this runs on the path that
# gates a production deploy, and an executable bit is easy to lose to a web edit,
# a zip round-trip or a `core.fileMode=false` clone. The mode bit is committed as
# 100755 anyway; this just stops it from being load-bearing.
#
# These two are the whole of the link checking that gates a PR, and both are
# offline and deterministic. External link checking is deliberately not here -
# see `lint-links` and `.github/workflows/links.yml`.
run = [
  "bash scripts/verify-base-path.sh",
  "bash scripts/verify-internal-links.sh",
]

[tasks.docs-clean]
description = "Remove build artifacts"
run = "rm -rf docs/dist docs/.astro"

[tasks.docs-browser]
description = "Install the Chromium browser Playwright uses for screenshots"
dir = "docs"
run = "bunx playwright install chromium"

[tasks.docs-screenshot]
description = "Build, serve, and screenshot a page (args: [out] [path]). Needs `mise run docs-browser` once."
dir = "docs"
run = """
out="{{arg(name='out', default='out.png')}}"
path="{{arg(name='path', default='/caseum/')}}"
bun run build
bun run preview --port 4321 > /tmp/astro-preview.log 2>&1 &
sleep 4
bunx playwright screenshot --viewport-size=1280,800 "http://localhost:4321${path}" "$out"
status=$?; pkill -f "astro preview" || true; exit $status
"""

[tasks.docs-presentation]
description = "Render the reveal.js introduction deck from its Quarto source"
# Quarto is scoped to this task rather than declared in `[tools]` on purpose: it
# is a large download, the rendered outputs are committed, and the deck changes
# perhaps once a year. A task-scoped tool is provisioned on first `mise run` and
# is invisible to `mise install`, so neither CI nor a new contributor pays for a
# toolchain they will not use. Verified: `mise ls --current` does not list it and
# `mise install` does not fetch it.
tools = { "aqua:quarto-dev/quarto-cli" = "1.10.18" }
run = "quarto render docs/public/presentations/introduction.qmd"

[tasks.lint]
description = "Run the prek hooks over all files (formatting, markdown lint, secrets)"
# lychee is skipped here and split into `mise run lint-links`. prek shards files
# across parallel hook invocations, and eight concurrent lychee processes hammer
# the same external hosts hard enough to produce spurious TLS handshake failures
# — observed on a URL that returns 200 when checked on its own. A blocking CI
# gate must not depend on other people's rate limiters.
run = "SKIP=lychee prek run --all-files"

[tasks.lint-links]
description = "Check every Markdown link, including external ones (needs network)"
# Driven from `git ls-files`, not a `**/*.md` glob: the glob also matches the
# ~520 dependency READMEs under `docs/node_modules`, which turns a 30-second
# check of 33 tracked files into a ten-minute crawl of other people's links.
# One lychee process, rather than prek's parallel shards — see `lint` above.
run = "git ls-files -z '*.md' '*.mdx' | xargs -0 lychee --no-progress --config .lychee.toml"

[tasks.audit]
description = "Audit the GitHub Actions workflows (zizmor, then actionlint+shellcheck)"
run = ["zizmor .", "actionlint"]

[tasks.ci]
description = "Run the same gates CI runs, in the same order"
# Deliberately a `run` list of explicit `mise run` calls rather than `depends`:
# mise may run `depends` entries in parallel, and these are strictly ordered
# (nothing can be checked or built before the site dependencies are installed).
run = [
  "mise run docs-install",
  "mise run docs-check",
  "mise run docs-build",
  "mise run docs-verify",
  "mise run lint",
  "mise run audit",
]

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""

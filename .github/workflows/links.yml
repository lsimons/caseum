# External link checking, on a schedule rather than on pull requests.
#
# Why this is not a PR gate
# -------------------------
# It was one, and it failed on PR #23: four links to `agilealliance.org` timed
# out from the runner while returning 301 in ~1.2s from a normal client, with
# zero actual errors. lychee already retries three times by default, so the
# failure had survived retries; raising the timeout would not have helped,
# because the host was not slow.
#
# The general problem is that a pull request would have been blocked by a third
# party's rate limiter, on a change that touched none of the affected links. Any
# external host can do that, on any PR, and the next one will not be
# `agilealliance.org`. Gating a merge on other people's uptime buys very little
# and costs a blocked queue at unpredictable times.
#
# Rot in external links is real, but it is not caused by the pull request in
# front of you and it does not need to be fixed within its lifetime. A weekly
# run finds it just as well.
#
# What is still gated on every PR (in `ci.yml`): the base-path check and the
# internal-link check, via `mise run docs-verify`. Both are offline and
# deterministic, and between them they cover every link this repository controls.
# What is no longer gated: reachability of third-party URLs.
name: Link check (external)

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Off the hour on purpose - scheduled jobs on the
    # hour queue behind everyone else's.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Check Markdown links
        run: mise run lint-links
